stages:
  - linters
  - tests
  - trigger
  - final

# === LINTERS ===

ruff:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install ruff
  script:
    - echo "Running ruff check"
    - ruff check .

flake8:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install flake8
  script:
    - echo "Running flake8"
    - flake8 . > flake8_report.txt || true
  artifacts:
    when: always
    paths:
      - flake8_report.txt
    expire_in: 7 days

pylint:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install pylint
  script:
    - echo "Running pylint"
    - pylint .

# === TESTS ===

tests:
  stage: tests
  image: python:3.12
  rules:
    - when: always
  before_script:
    - echo "Installing dependencies"
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - |
      set +e
      echo "Running tests with api marker"
      pytest -m api

      status=$?
      echo "Pytest exit code $status"
      exit $status
  artifacts:
    when: always
    paths:
      - allure-results
    expire_in: 7 days

# === TRIGGER ===

e2e_tests:
  stage: trigger
  trigger:
    project: python-auto-qa/workspaces/altair/UMBUT/pokemonbattle_e2e_tests_selenium
    branch: develop
    strategy: depend
  rules:
    - when: always

# === FINAL ===

final_job:
  stage: final
  image: python:3.12
  when: manual
  script:
    - echo "Pipeline completed successfully"